name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          python -m pip install uv==0.13.5
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          uv sync --frozen
      - run: uv run ruff check src tests ops scripts
      - run: uv run ruff format --check src tests ops scripts
      - run: uv run bandit -q -r src ops scripts
      - run: uv run pytest -q
      - run: uv run pip-audit --progress-spinner off
      - name: Secrets and tracked files
        run: |
          uv run python scripts/check_secrets.py
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /repo --redact --exit-code 1

  image:
    needs: checks
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image

  release-image:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
      - name: Publish the scanned architecture by digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag srtube:ci "$image:sha-$GITHUB_SHA-$ARCH"
          docker push "$image:sha-$GITHUB_SHA-$ARCH"
          docker inspect "$image:sha-$GITHUB_SHA-$ARCH" --format '{{index .RepoDigests 0}}' > "$ARCH.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ matrix.arch }}.txt
          retention-days: 1
          compression-level: 0

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: release-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Publish already scanned images and immutable release descriptor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for arch in amd64 arm64; do
            grep -Ex "${image}@sha256:[a-f0-9]{64}" "digests/$arch.txt"
          done
          docker buildx imagetools create -t "$image:sha-$GITHUB_SHA" "$(cat digests/amd64.txt)" "$(cat digests/arm64.txt)"
          digest="$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          jq -n --arg image "$image@$digest" --arg sha "$GITHUB_SHA" --arg repository "$GITHUB_REPOSITORY" '{image:$image,sha:$sha,repository:$repository}' > release.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: srtube-release
          path: release.json
          retention-days: 90
