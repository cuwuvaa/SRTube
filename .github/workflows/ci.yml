name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          python -m pip install uv==0.13.5
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          uv sync --frozen
      - run: uv run ruff check src tests ops scripts
      - run: uv run ruff format --check src tests ops scripts
      - run: uv run bandit -q -r src ops scripts
      - run: uv run pytest -q
      - run: uv run pip-audit --progress-spinner off
      - name: Secrets and tracked files
        run: |
          uv run python scripts/check_secrets.py
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /repo --redact --exit-code 1

  image:
    needs: checks
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build once on native architecture
        run: docker build --pull --build-arg REVISION="$GITHUB_SHA" -t srtube:ci .
      - name: Offline image check
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 96 --memory 512m --cpus 1 --tmpfs /tmp:rw,noexec,nosuid,size=128m --tmpfs /app/data:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=700 srtube:ci python -m srtube --check
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 96 --memory 512m --cpus 0.55 --tmpfs /tmp:rw,noexec,nosuid,size=128m srtube:ci python -m srtube.selftest
      - name: Test production isolation and Unix socket between containers
        run: python3 scripts/container_smoke.py --image srtube:ci
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: srtube:ci
          grype-version: v0.121.1
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: table
      - name: Publish the scanned architecture by digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag srtube:ci "$image:sha-$GITHUB_SHA-$ARCH"
          docker push "$image:sha-$GITHUB_SHA-$ARCH"
          docker inspect "$image:sha-$GITHUB_SHA-$ARCH" --format '{{index .RepoDigests 0}}' > "$ARCH.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ matrix.arch }}.txt
          retention-days: 1
          compression-level: 0

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Publish already scanned images and immutable release descriptor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for arch in amd64 arm64; do
            grep -Ex "${image}@sha256:[a-f0-9]{64}" "digests/$arch.txt"
          done
          docker buildx imagetools create -t "$image:sha-$GITHUB_SHA" "$(cat digests/amd64.txt)" "$(cat digests/arm64.txt)"
          digest="$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          jq -n --arg image "$image@$digest" --arg sha "$GITHUB_SHA" --arg repository "$GITHUB_REPOSITORY" '{image:$image,sha:$sha,repository:$repository}' > release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: srtube-release
          path: release.json
          retention-days: 90
